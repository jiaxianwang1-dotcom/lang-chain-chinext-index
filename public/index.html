<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智能体助手 + 大盘指数</title>
  <link rel="stylesheet" href="/common.css">
  <style>
    /* ========== 智能咨询 Tab 专属样式（迁移自旧版 inline） ========== */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
    }
    .message { margin-bottom: 16px; display: flex; gap: 10px; animation: fadeIn 0.3s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .message.user { justify-content: flex-end; }
    .message.assistant { justify-content: flex-start; }
    .avatar {
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; flex-shrink: 0;
    }
    .message.user .avatar { background: #667eea; }
    .message.assistant .avatar { background: #e8e8e8; }
    .bubble {
      max-width: 70%; padding: 12px 16px; border-radius: 16px;
      line-height: 1.6; font-size: 14px;
      word-break: break-word; white-space: pre-wrap;
    }
    .message.user .bubble {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white; border-bottom-right-radius: 4px;
    }
    .message.assistant .bubble {
      background: white; color: #333;
      border-bottom-left-radius: 4px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }
    .typing-indicator { display: inline-flex; gap: 4px; padding: 4px 0; }
    .typing-indicator span {
      width: 6px; height: 6px; background: #999; border-radius: 50%;
      animation: typing 1.4s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typing {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-6px); opacity: 1; }
    }
    .input-area {
      background: white; border-top: 1px solid #e5e5e5;
      padding: 14px 20px; max-width: 800px; width: 100%; margin: 0 auto;
    }
    .input-wrapper { display: flex; gap: 10px; align-items: flex-end; }
    .input-wrapper textarea {
      flex: 1; border: 1px solid #ddd; border-radius: 12px;
      padding: 12px 16px; font-size: 14px; font-family: inherit;
      resize: none; outline: none; max-height: 120px; line-height: 1.5;
      transition: border-color 0.2s;
    }
    .input-wrapper textarea:focus { border-color: #667eea; }
    .input-wrapper button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white; border: none; width: 44px; height: 44px;
      border-radius: 12px; cursor: pointer; font-size: 18px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.1s, opacity 0.2s; flex-shrink: 0;
    }
    .input-wrapper button:hover { transform: scale(1.05); }
    .input-wrapper button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .welcome { text-align: center; padding: 60px 20px; color: #888; }
    .welcome h2 { font-size: 22px; color: #555; margin-bottom: 12px; }
    .welcome p { font-size: 14px; margin-bottom: 6px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
    .suggestions button {
      background: white; border: 1px solid #ddd;
      padding: 7px 14px; border-radius: 20px; cursor: pointer;
      font-size: 13px; color: #555; transition: all 0.2s;
    }
    .suggestions button:hover { border-color: #667eea; color: #667eea; background: #f0f4ff; }

    /* ========== 大盘指数 Tab 专属样式 ========== */
    .stock-cards {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
    }
    .stock-card {
      background: white; border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;
      min-width: 0;
    }
    .card-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;
    }
    .card-title { font-size: 16px; font-weight: 600; color: #333; }
    .card-sub { font-size: 12px; color: #888; margin-top: 2px; }
    .card-latest { text-align: right; }
    .latest-close { font-size: 20px; font-weight: 600; color: #333; }
    .latest-pct { font-size: 13px; margin-top: 2px; color: #888; }
    .latest-pct.up { color: #c0392b; }
    .latest-pct.down { color: #27ae60; }
    .latest-time { font-size: 11px; color: #aaa; margin-top: 2px; }
    .card-predict {
      display: flex; flex-direction: column; gap: 4px;
      background: #f7f8fc; border: 1px dashed #d9def0; border-radius: 8px;
      padding: 8px 12px; font-size: 12px; color: #666;
    }
    .card-predict .pred-label { font-size: 11px; color: #888; }
    .card-predict .pred-main {
      display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
    }
    .card-predict .pred-pct { font-size: 18px; font-weight: 600; color: #555; }
    .card-predict .pred-pct.up { color: #c0392b; }
    .card-predict .pred-pct.down { color: #27ae60; }
    .card-predict .pred-range {
      font-size: 11px; color: #777; background: #fff;
      border: 1px solid #e0e3ee; padding: 1px 6px; border-radius: 4px;
    }
    .card-predict .pred-bucket {
      font-size: 11px; padding: 1px 8px; border-radius: 8px;
      color: white; font-weight: 500;
    }
    .card-predict .pred-bucket.bucket-small { background: #95a5a6; }
    .card-predict .pred-bucket.bucket-medium { background: #f39c12; }
    .card-predict .pred-bucket.bucket-large { background: #e74c3c; }
    .card-predict .pred-conf { font-size: 11px; color: #999; }
    .card-predict .pred-dims {
      font-size: 11px; color: #667eea; font-family: SFMono-Regular, Menlo, monospace;
    }
    .card-predict .pred-rationale { font-size: 11px; color: #888; line-height: 1.5; }
    .card-predict button.pred-refresh {
      align-self: flex-start; background: transparent; border: 1px solid #c7cce0;
      color: #667eea; border-radius: 4px; font-size: 11px;
      padding: 2px 8px; cursor: pointer; margin-top: 2px;
    }
    .card-predict button.pred-refresh:hover { border-color: #667eea; background: #eef1ff; }
    .card-predict button.pred-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
    .card-predict .pred-prompt-toggle { margin-top: 2px; }
    .card-predict .pred-prompt-btn {
      align-self: flex-start; background: transparent; border: 1px solid #c7cce0;
      color: #667eea; border-radius: 4px; font-size: 11px;
      padding: 2px 8px; cursor: pointer;
    }
    .card-predict .pred-prompt-btn:hover { border-color: #667eea; background: #eef1ff; }
    .card-predict .pred-prompt-panel {
      margin-top: 6px; background: #fff; border: 1px solid #e0e3ee;
      border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 10px;
      max-height: 360px; overflow-y: auto;
    }
    .card-predict .pred-prompt-panel::-webkit-scrollbar { width: 4px; }
    .card-predict .pred-prompt-panel::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .card-predict .pred-prompt-section { display: flex; flex-direction: column; gap: 4px; }
    .card-predict .pred-prompt-title {
      font-size: 11px; font-weight: 600; color: #667eea;
    }
    .card-predict .pred-prompt-content {
      font-size: 11px; color: #555; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      background: #f7f8fc; padding: 8px; border-radius: 4px;
      max-height: 200px; overflow-y: auto;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .card-chart-wrap { height: 200px; position: relative; }
    .card-table-wrap { max-height: 280px; overflow: auto; border: 1px solid #f0f0f0; border-radius: 6px; }
    .quotes-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .quotes-table thead th {
      background: #fafbfd; color: #666; font-weight: 500;
      text-align: right; padding: 8px 10px; position: sticky; top: 0;
      border-bottom: 1px solid #eee;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .quotes-table thead th:first-child { text-align: left; }
    .quotes-table tbody td {
      padding: 6px 10px; text-align: right; border-bottom: 1px solid #f5f5f5;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .quotes-table tbody td:first-child { text-align: left; color: #555; }
    .quotes-table td.up { color: #c0392b; }
    .quotes-table td.down { color: #27ae60; }
    .card-status { font-size: 12px; color: #999; min-height: 16px; }
    .card-status button {
      background: #667eea; color: white; border: none;
      border-radius: 4px; padding: 3px 10px; margin-left: 6px;
      cursor: pointer; font-size: 12px;
    }

    /* ========== 预测准确率 Tab 专属样式 ========== */
    .acc-wrap { padding: 16px; flex: 1; overflow-y: auto; }
    .acc-toolbar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .acc-toolbar label { font-size: 13px; color: #555; }
    .acc-toolbar select, .acc-toolbar button {
      padding: 6px 10px; border-radius: 6px; border: 1px solid #ddd;
      font-size: 13px; cursor: pointer; background: white;
    }
    .acc-toolbar button {
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      border: none;
    }
    .acc-toolbar button:disabled { opacity: 0.6; cursor: not-allowed; }
    .acc-stats {
      display: grid; gap: 12px;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      margin-bottom: 20px;
    }
    .acc-stat-card {
      background: white; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 14px 16px;
    }
    .acc-stat-name { font-size: 14px; color: #555; font-weight: 500; margin-bottom: 10px; }
    .acc-stat-row {
      display: flex; justify-content: space-between; align-items: baseline;
      font-size: 13px; color: #666; margin-bottom: 6px;
    }
    .acc-stat-row b {
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px; color: #333; font-weight: 600;
    }
    .acc-stat-row b.good { color: #27ae60; }
    .acc-stat-row b.bad { color: #c0392b; }
    .acc-reviews-table-wrap {
      background: white; border-radius: 10px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 12px; overflow-x: auto;
    }
    .acc-reviews-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .acc-reviews-table thead th {
      background: #fafbfd; color: #666; font-weight: 500;
      text-align: right; padding: 8px 10px; border-bottom: 1px solid #eee;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .acc-reviews-table thead th:first-child,
    .acc-reviews-table thead th:nth-child(2) { text-align: left; }
    .acc-reviews-table tbody td {
      padding: 6px 10px; text-align: right; border-bottom: 1px solid #f5f5f5;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .acc-reviews-table tbody td:first-child,
    .acc-reviews-table tbody td:nth-child(2) { text-align: left; color: #555; }
    .acc-reviews-table td.hit { color: #27ae60; }
    .acc-reviews-table td.miss { color: #c0392b; }
    .acc-reviews-table td.up { color: #c0392b; }
    .acc-reviews-table td.down { color: #27ae60; }
    .acc-reviews-table td .acc-analysis {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 11px;
      color: #444;
      line-height: 1.4;
      text-align: left;
      max-width: 320px;
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
    }

    /* ========== 多信号面板 Tab 样式 ========== */
    .sig-wrap { padding: 16px; flex: 1; overflow-y: auto; }
    .sig-toolbar {
      display: flex; gap: 12px; align-items: center; margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .sig-toolbar button {
      padding: 6px 12px; border-radius: 6px; border: none;
      background: linear-gradient(135deg, #667eea, #764ba2); color: white;
      font-size: 13px; cursor: pointer;
    }
    .sig-toolbar button:disabled { opacity: 0.6; cursor: not-allowed; }
    .sig-toolbar button.secondary {
      background: white; border: 1px solid #ddd; color: #555;
    }
    .sig-toolbar .sig-asof {
      font-size: 13px; color: #888; font-family: SFMono-Regular, Menlo, monospace;
    }
    .sig-grid {
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
    }
    .sig-card {
      background: white; border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
      min-width: 0;
      height: 320px;
    }
    .sig-card-title {
      font-size: 14px; font-weight: 600; color: #333;
      border-bottom: 1px solid #f0f0f0; padding-bottom: 8px;
      display: flex; justify-content: space-between; align-items: center;
    }
    .sig-card-title .sig-card-hint {
      font-size: 11px; color: #888; font-weight: 400;
    }
    .sig-card-body { font-size: 12px; color: #555; line-height: 1.6; flex: 1; overflow-y: auto; }
    .sig-card-body::-webkit-scrollbar { width: 4px; }
    .sig-card-body::-webkit-scrollbar-thumb { background: #ddd; border-radius: 2px; }
    .sig-card-body .sig-empty { color: #aaa; padding: 12px; text-align: center; }
    .sig-row { display: flex; justify-content: space-between; padding: 2px 0; }
    .sig-row b {
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
      font-weight: 500; color: #333;
    }
    .sig-row b.up { color: #c0392b; }
    .sig-row b.down { color: #27ae60; }
    .sig-mini-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .sig-mini-table thead th {
      background: #fafbfd; color: #666; font-weight: 500;
      padding: 6px 8px; text-align: right; border-bottom: 1px solid #eee;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .sig-mini-table thead th:first-child { text-align: left; }
    .sig-mini-table tbody td {
      padding: 5px 8px; text-align: right; border-bottom: 1px solid #f5f5f5;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .sig-mini-table tbody td:first-child { text-align: left; color: #555; }
    .sig-mini-table td.up { color: #c0392b; }
    .sig-mini-table td.down { color: #27ae60; }
    .sig-tag {
      display: inline-block; padding: 1px 8px; border-radius: 8px;
      font-size: 11px; color: white;
    }
    .sig-tag.up { background: #c0392b; }
    .sig-tag.down { background: #27ae60; }
    .sig-tag.neutral { background: #95a5a6; }
    .sig-tag.imp-3 { background: #e74c3c; }
    .sig-tag.imp-2 { background: #f39c12; }
    .sig-tag.imp-1 { background: #95a5a6; }
    .sig-event-list { display: flex; flex-direction: column; gap: 6px; }
    .sig-event {
      display: grid; grid-template-columns: 88px 36px 1fr; gap: 8px;
      padding: 4px 0; border-bottom: 1px dashed #f0f0f0; align-items: baseline;
    }
    .sig-event .sig-event-date {
      font-family: SFMono-Regular, Menlo, monospace; font-size: 11px; color: #777;
    }
    .sig-event .sig-event-name { font-size: 12px; color: #444; }
    .sig-event .sig-event-rel { font-size: 11px; color: #aaa; margin-left: 4px; }
    .sig-event .sig-event-meta { font-size: 11px; color: #888; }
    .sig-news-item {
      padding: 5px 0; border-bottom: 1px dashed #f0f0f0;
      display: flex; flex-direction: column; gap: 3px;
    }
    .sig-news-item .sig-news-head {
      display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
    }
    .sig-news-item .sig-news-title { font-size: 12px; color: #333; }
    .sig-news-item .sig-news-rationale { font-size: 11px; color: #888; }
    .sig-news-item.chi-next {
      border-left: 3px solid #9b59b6;
      padding-left: 8px;
      background: #faf5ff;
      border-radius: 0 4px 4px 0;
    }

    /* ========== 体育彩票 Tab 专属样式 ========== */
    .lottery-cards {
      flex: 1; overflow-y: auto; padding: 16px;
      display: grid; gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(520px, 1fr));
    }
    .lottery-card {
      background: white; border-radius: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
      padding: 16px 18px; display: flex; flex-direction: column; gap: 12px;
      min-width: 0;
    }
    .lottery-card .card-head {
      display: flex; justify-content: space-between; align-items: flex-start;
      gap: 12px; padding-bottom: 8px; border-bottom: 1px solid #f0f0f0;
    }
    .lottery-card .card-title { font-size: 16px; font-weight: 600; color: #333; }
    .lottery-card .card-sub { font-size: 12px; color: #888; margin-top: 2px; }
    .lottery-balls {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .lottery-ball {
      width: 32px; height: 32px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 13px; font-weight: 600; color: white;
      background: linear-gradient(135deg, #e74c3c, #c0392b);
      box-shadow: 0 2px 4px rgba(231, 76, 60, 0.3);
    }
    .lottery-ball.blue {
      background: linear-gradient(135deg, #3498db, #2980b9);
      box-shadow: 0 2px 4px rgba(52, 152, 219, 0.3);
    }
    .lottery-ball.plus {
      background: none; color: #999; font-size: 16px;
      box-shadow: none; width: auto; padding: 0 4px;
    }
    .lottery-predict {
      display: flex; flex-direction: column; gap: 8px;
      background: #f7f8fc; border: 1px dashed #d9def0; border-radius: 8px;
      padding: 12px; font-size: 12px; color: #666;
    }
    .lottery-predict .pred-label {
      font-size: 11px; color: #888; display: flex; justify-content: space-between; align-items: center;
    }
    .lottery-predict .pred-group {
      background: white; border: 1px solid #e0e3ee; border-radius: 6px;
      padding: 10px; display: flex; flex-direction: column; gap: 6px;
    }
    .lottery-predict .pred-group-title {
      font-size: 12px; font-weight: 600; color: #667eea;
    }
    .lottery-predict .pred-rationale {
      font-size: 11px; color: #666; line-height: 1.5;
    }
    .lottery-predict .pred-conf {
      font-size: 11px; color: #999;
    }
    .lottery-predict button.pred-refresh {
      align-self: flex-start; background: transparent; border: 1px solid #c7cce0;
      color: #667eea; border-radius: 4px; font-size: 11px;
      padding: 4px 12px; cursor: pointer; margin-top: 4px;
    }
    .lottery-predict button.pred-refresh:hover { border-color: #667eea; background: #eef1ff; }
    .lottery-predict button.pred-refresh:disabled { opacity: 0.5; cursor: not-allowed; }
    .lottery-predict .pred-prompt-toggle { margin-top: 4px; }
    .lottery-predict .pred-prompt-btn {
      align-self: flex-start; background: transparent; border: 1px solid #c7cce0;
      color: #667eea; border-radius: 4px; font-size: 11px;
      padding: 2px 8px; cursor: pointer;
    }
    .lottery-predict .pred-prompt-btn:hover { border-color: #667eea; background: #eef1ff; }
    .lottery-predict .pred-prompt-panel {
      margin-top: 6px; background: #fff; border: 1px solid #e0e3ee;
      border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 10px;
      max-height: 360px; overflow-y: auto;
    }
    .lottery-predict .pred-prompt-section { display: flex; flex-direction: column; gap: 4px; }
    .lottery-predict .pred-prompt-title {
      font-size: 11px; font-weight: 600; color: #667eea;
    }
    .lottery-predict .pred-prompt-content {
      font-size: 11px; color: #555; line-height: 1.5;
      white-space: pre-wrap; word-break: break-word;
      background: #f7f8fc; padding: 8px; border-radius: 4px;
      max-height: 200px; overflow-y: auto;
      font-family: SFMono-Regular, Menlo, Consolas, monospace;
    }
    .lottery-table-wrap { max-height: 320px; overflow: auto; border: 1px solid #f0f0f0; border-radius: 6px; }
    .lottery-table {
      width: 100%; border-collapse: collapse; font-size: 12px;
    }
    .lottery-table thead th {
      background: #fafbfd; color: #666; font-weight: 500;
      text-align: center; padding: 8px 6px; position: sticky; top: 0;
      border-bottom: 1px solid #eee;
    }
    .lottery-table thead th:first-child { text-align: left; padding-left: 10px; }
    .lottery-table tbody td {
      padding: 8px 6px; text-align: center; border-bottom: 1px solid #f5f5f5;
    }
    .lottery-table tbody td:first-child { text-align: left; color: #555; padding-left: 10px; }
    .lottery-status { font-size: 12px; color: #999; min-height: 16px; }
    .lottery-disclaimer {
      font-size: 11px; color: #c0392b; background: #fdf2f2;
      border: 1px solid #f5c6cb; border-radius: 6px;
      padding: 8px 12px; margin-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>AI 智能助手 · 大盘指数</h1>
      <div class="subtitle">实时行情 · 智能问答 · 多窗口切换 · 5 分钟自动刷新</div>
    </div>
  </div>

  <nav class="tabs">
    <button class="tab" data-tab="chat">智能咨询</button>
    <button class="tab" data-tab="stock">大盘指数</button>
    <button class="tab" data-tab="signals">多信号面板</button>
    <button class="tab" data-tab="accuracy">预测准确率</button>
    <button class="tab" data-tab="lottery">体育彩票</button>
  </nav>

  <main>
    <!-- 智能咨询 Tab -->
    <section class="panel" data-panel="chat">
      <div class="chat-container" id="chatContainer">
        <div class="welcome" id="welcome">
          <h2>👋 你好，我是你的智能助手</h2>
          <p>我可以基于实时行情数据回答大盘问题</p>
          <p>请在上方选择时间范围（默认近 30 天）</p>
          <div class="suggestions">
            <button onclick="sendSuggestion('上证最近表现怎么样？')">上证最近表现</button>
            <button onclick="sendSuggestion('近一年创业板涨跌幅')">创业板年度</button>
            <button onclick="sendSuggestion('今天大盘走势如何？')">今日大盘</button>
            <button onclick="sendSuggestion('A股最近有什么消息面')">消息面</button>
          </div>
        </div>
      </div>
      <div class="input-area">
        <div class="input-wrapper">
          <textarea id="messageInput" placeholder="输入消息... (Enter 发送, Shift+Enter 换行)" rows="1"></textarea>
          <button id="sendBtn">➤</button>
        </div>
      </div>
    </section>

    <!-- 大盘指数 Tab -->
    <section class="panel" data-panel="stock"></section>

    <!-- 多信号面板 Tab -->
    <section class="panel" data-panel="signals"></section>

    <!-- 体育彩票 Tab -->
    <section class="panel" data-panel="lottery"></section>

    <!-- 预测准确率 Tab -->
    <section class="panel" data-panel="accuracy"></section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/common.js"></script>
  <script src="/chat.js"></script>
  <script src="/stock.js"></script>
  <script src="/lottery.js"></script>
  <script src="/signals.js"></script>
  <script src="/accuracy.js"></script>
  <script>
    // 把 Tab 切换与各模块的激活/暂停钩起来：
    window.AppCommon.setupTabs(function (name) {
      if (name === "stock") {
        window.StockTab && window.StockTab.onActivate();
      } else {
        window.StockTab && window.StockTab.onDeactivate();
      }
      if (name === "lottery") {
        window.LotteryTab && window.LotteryTab.onActivate();
      } else {
        window.LotteryTab && window.LotteryTab.onDeactivate();
      }
      if (name === "signals") {
        window.SignalsTab && window.SignalsTab.onActivate();
      }
      if (name === "accuracy") {
        window.AccuracyTab && window.AccuracyTab.onActivate();
      }
    });
  </script>
</body>
</html>
